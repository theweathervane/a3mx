# a3mx test runner as a Portainer stack (or `docker compose up --build` on the Docker host).
# Each start of the container fetches the newest code and runs the tests, then the container stops.
# Set these in Portainer's stack "Environment variables" (or a .env file beside this one, which
# is git-ignored: the place for anything about your own machines):
#   A3MX_ISO_DIR    folder on the Docker host holding your ULUS-10062 .iso       (required) -> /iso
#   A3MX_TESTS_DIR  folder on the Docker host for the clone, the build and the
#                   results: a3mx/ and results/ are made in it                     (required) -> /tests
#   A3MX_GIT_URL    a mirror to clone from instead of GitLab, e.g. your own Gitea
#   and any A3MX_* setting from run-tests.sh (A3MX_TESTS, A3MX_SUITE, A3MX_GIT_REF, ...)
name: a3mx-tests

services:
  tests:
    build:
      context: .
    image: a3mx-tests:latest
    # Always built here, never pulled: Portainer's "Pull and redeploy" would otherwise look for
    # a3mx-tests on Docker Hub. Each deploy rebuilds (cached: quick unless this folder changed).
    pull_policy: build
    container_name: a3mx-tests
    restart: "no"
    # Docker's default network: a stack's own network uses Docker's built-in DNS, which can fail to
    # resolve names on some NAS systems (TerraMaster: "Could not resolve host: gitlab.com"). No ports.
    network_mode: bridge
    environment:
      A3MX_GIT_URL: ${A3MX_GIT_URL:-https://gitlab.com/theweathervane-group/a3mx.git}
      A3MX_GIT_REF: ${A3MX_GIT_REF:-main}
      A3MX_GIT_TOKEN: ${A3MX_GIT_TOKEN:-}
      A3MX_GIT_USER: ${A3MX_GIT_USER:-oauth2}
      A3MX_SUITE: ${A3MX_SUITE:-disc}
      A3MX_TESTS: ${A3MX_TESTS:-}
      A3MX_EXCLUDE: ${A3MX_EXCLUDE:-}
      A3MX_JOBS: ${A3MX_JOBS:-}
      A3MX_REEXTRACT: ${A3MX_REEXTRACT:-0}
      A3MX_CLEAN: ${A3MX_CLEAN:-0}
      TZ: ${TZ:-Europe/London}
    volumes:
      - ${A3MX_ISO_DIR:?set A3MX_ISO_DIR to the folder holding your ISO}:/iso:ro
      - ${A3MX_TESTS_DIR:?set A3MX_TESTS_DIR to a folder for the clone, build and results}:/tests
